name: Release

on:
  workflow_dispatch: {}

  push:
    tags:
      - '**'

jobs:
  validate-tag:
    runs-on: self-hosted
    outputs:
      semver-valid: ${{ steps.check-tag.outputs.valid }}
    steps:
      - uses: actions/checkout@v6
      - name: Check if tag is a valid SemVer
        id: check-tag
        run: |
          python3 -u .github/scripts/semver_regex.py
        env:
          TAG: ${{ github.ref_name }}

  validate:
    needs: [validate-tag]
    if: needs.validate-tag.outputs.semver-valid == 'true'
    uses: ./.github/workflows/validate.yaml

  build-and-publish:
    runs-on: self-hosted
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Golang
        uses: actions/setup-go@v6
        with:
          go-version: ~1.23

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Github registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "2.9.0"
          args: --config .goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish archives as artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-archives
          path: |
            ./dist/*.tar.gz
            ./dist/*.tar.gz.sha256
