name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      tag:
        description: "Tag to release"
        required: false
        type: string
        default: ""

  push:
    tags:
      - '**'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      semver-valid: ${{ steps.check-tag.outputs.valid }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_NAME="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" =~ refs/tags/(.+) ]]; then
            TAG_NAME="${BASH_REMATCH[1]}"
          else
            echo "No tag found"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Check if tag is a valid SemVer
        id: check-tag
        run: |
          python3 -u .github/scripts/semver_regex.py
        env:
          TAG: ${{ steps.tag.outputs.tag_name }}

  test-and-lint:
    name: Test and Lint
    needs: [validate-tag]
    if: needs.validate-tag.outputs.semver-valid == 'true'
    uses: ./.github/workflows/test-and-lint.yaml

  build-and-publish:
    runs-on: ubuntu-latest
    needs: ["validate-tag", "test-and-lint"]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Golang
        uses: actions/setup-go@v6
        with:
          go-version: ~1.23

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Github registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "2.9.0"
          args: --config .goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish archives as artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-archives
          path: |
            ./dist/*.tar.gz
            ./dist/*.tar.gz.sha256
