# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: far-edge-kubelet

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - '7'

    main: ./cmd/far-edge-kubelet
    ldflags:
      - -extldflags "-static"
      - -X main.buildVersion={{ .Env.Summary }}
      - -X main.buildTime={{ .Date }}
    tags:
      - netgo
      - osusergo

dockers:
  - id: develpment-amd64
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
    image_templates:
      - gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Summary }}-amd64
      - gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Branch }}-amd64
    extra_files:
      - deploy/configuration-data
    dockerfile: Dockerfile
    use: buildx
  - id: develpment-arm64
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64
    image_templates:
      - gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Summary }}-arm64
      - gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Branch }}-arm64
    extra_files:
      - deploy/configuration-data
    dockerfile: Dockerfile
    use: buildx
  - id: develpment-armv7
    goarch: arm
    goarm: '7'
    build_flag_templates:
      - --platform=linux/arm/v7
    image_templates:
      - gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Summary }}-arm-v7
      - gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Branch }}-arm-v7
    extra_files:
      - deploy/configuration-data
    dockerfile: Dockerfile
    use: buildx

docker_manifests:
  - id: development
    name_template: gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Branch }}
    image_templates:
      - gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Summary }}-amd64
      - gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Summary }}-arm64
      - gitea.lab.fraunhofer.pt/fita/far-edge-kubelet:{{ .Env.Summary }}-arm-v7

checksum:
  split: true

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

release:
  disable: true

announce:
  skip: true
